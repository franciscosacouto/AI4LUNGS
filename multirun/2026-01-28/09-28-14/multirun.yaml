hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - Configs=config_lung.yaml,config_masked.yaml
  job:
    name: encoder_survivalhead
    chdir: null
    override_dirname: Configs=config_lung.yaml,config_masked.yaml
    id: ???
    num: ???
    config_name: config_ws
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /nas-ctm01/homes/fmferreira/AI4LUNGS
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /nas-ctm01/homes/fmferreira/AI4LUNGS/Configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
directories:
  rootdir_lung: /nas-ctm01/datasets/public/medical_datasets/lung_ct_datasets/nlst/preprocessed_data/protocol_5/2d/ws
  rootdir_ws: /nas-ctm01/datasets/public/medical_datasets/lung_ct_datasets/nlst/preprocessed_data/protocol_5/2d/ws
  rootdir: /nas-ctm01/datasets/public/medical_datasets/lung_ct_datasets/nlst/preprocessed_data/protocol_5/2d/lung
  image_df_path: /nas-ctm01/homes/fmferreira/AI4LUNGS/lung_file_paths.csv
  cancer_path: /nas-ctm01/datasets/public/medical_datasets/lung_ct_datasets/nlst/cancer_info_final_mapped.csv
data:
  columns:
    pid: pid
    file_path: file_path
SEED: 22
test_size: 0.2
BATCH_SIZE_CPU: 32
BATCH_SIZE_GPU: 32
EPOCHS: 100
LEARNING_RATE: 0.0001
Freeze_weights: true
Binary_model: true
Threshold_metrics: 0.6
model_name: Binary_ws
project: evaluate_region_of_interest
seed_value: 22
early_stopping:
  monitor: val_loss
  patience: 15
  verbose: false
  mode: min
test_fraction_of_entire_dataset: 0.2
weighted_random_sampler: true
dimension: 2
visualize_imgur: false
roi: ws
dataset_name: NLST
data_preprocessing_protocol_number: 4
data_type: whole_slice
data_augmentation:
  apply: true
  augmented_to_original_data_ratio: 2
  parameters:
    number_of_augmentations: 3
    random_rotation_degrees: 10
    random_translation_fraction: 0.1
    random_brightness_intensity_factor: 0.3
    random_contrast_intensity_factor: 0.3
    random_gaussian_blur:
      kernel_size:
      - 3
      - 3
      sigma:
      - 0.1
      - 1.0
    random_gaussian_noise_variance: 0.001
    random_elastic_alpha: 10.0
    random_elastic_sigma: 5.0
image_numpy_arrays_dir_path: ${...experiment_execution.paths.preprocessed_data_dir_path}/protocol_${..data_preprocessing_protocol_number}/${..metadataframe.data_type}_numpy_arrays
number_of_k_folds: 3
torch_dataloader_kwargs:
  batch_size: 32
  num_workers: 8
validation_fraction_of_train_set: 0.1
resize: ${..resize}
resample: false
resample_z: false
